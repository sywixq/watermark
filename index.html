<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent !important;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  .bar {
    --bar-radius: 7px;
    position: fixed;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0;
    background: rgba(22, 22, 24, 0.6);
    border-radius: var(--bar-radius);
    overflow: hidden;
    clip-path: inset(0 round var(--bar-radius));
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    isolation: isolate;
    transform: translate3d(0, 0, 0);
    font-family: Arial, sans-serif;
    color: #d7d7d7;
  }
  .bar::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: #ff1f1f;
    border-radius: var(--bar-radius) 0 0 var(--bar-radius);
    z-index: 2;
  }
  .cell {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 12px;
    border-right: 1px solid rgba(255, 255, 255, 0.14);
  }
  .cell:last-child {
    border-right: none;
  }
  .logo-section {
    position: relative;
    background: rgba(22, 22, 24, 1);
    padding: 0 14px 0 14px;
    gap: 7px;
    border-right: none;
    border-radius: 0 6px 6px 0;
    overflow: hidden;
  }
  .logo-section + .cell {
    border-left: 1px solid rgba(255, 255, 255, 0.14);
  }
  .logo-image {
    display: block;
    height: 30px;
    width: auto;
    filter: brightness(0) invert(1);
  }
  .brand {
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    color: #e5e7ed;
    letter-spacing: 0;
    transform: translateY(-0.5px);
  }
  .info {
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    color: #d9d9db;
    white-space: nowrap;
  }
  .info.expires {
    color: #d9d9db;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo-section cell">
      <span class="brand">Rex.wtf</span>
    </div>
    <div class="info cell" id="pid">01940</div>
    <div class="info cell" id="date">--</div>
    <div class="info expires cell" id="expire">Expires in 11-03-2026</div>
  </div>

  <script>
    function readQuery(keys) {
      var params = new URLSearchParams(window.location.search);
      for (var i = 0; i < keys.length; i++) {
        var val = params.get(keys[i]);
        if (val) return val;
      }
      return '';
    }

    function autoPlayerId() {
      return readQuery(['pid', 'id']) || document.getElementById('pid').textContent;
    }

    function autoExpire() {
      var fromQuery = readQuery(['expire', 'exp', 'expires']);
      if (fromQuery) return fromQuery;

      var fromLocal = localStorage.getItem('rex_expire') || localStorage.getItem('expire');
      if (fromLocal) return fromLocal;

      if (typeof window.__REX_EXPIRE__ === 'string' && window.__REX_EXPIRE__) {
        return window.__REX_EXPIRE__;
      }

      return '';
    }

    function formatDate(value) {
      if (!value) return '--';
      return value;
    }

    function getTodayText() {
      var now = new Date();
      return now.toLocaleDateString('en-US', {
        month: 'short',
        day: '2-digit',
        year: 'numeric'
      }).replace(',', '');
    }

    function setTodayDate() {
      document.getElementById('date').textContent = getTodayText();
    }

    document.getElementById('pid').textContent = autoPlayerId();
    var expireText = autoExpire();
    if (expireText) {
      document.getElementById('expire').textContent = 'Expires in ' + formatDate(expireText);
    }
    setTodayDate();
    setInterval(setTodayDate, 60000);

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'setPlayerId') {
        document.getElementById('pid').textContent = e.data.id;
      }
      if (e.data.type === 'setDate') {
        document.getElementById('date').textContent = formatDate(e.data.date);
      }
      if (e.data.type === 'setExpire') {
        document.getElementById('expire').textContent = 'Expires in ' + formatDate(e.data.date);
      }
      if (e.data.type === 'setExpireText') {
        document.getElementById('expire').textContent = 'Expires in ' + formatDate(e.data.expire);
      }
    });
  </script>
</body>
</html>
