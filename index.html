<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent !important;
    font-family: Arial, sans-serif;
  }

.watermark {
  position: fixed;
  top: 8px;
  right: 8px;   /* sağa alır */
  display: inline-flex;
  align-items: center;
  height: 30px;
  border-radius: 7px;
  overflow: hidden;
  background: rgba(13, 16, 22, 0.84);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35) inset;
  color: #d5d8df;
  backdrop-filter: blur(2px);
}

  .seg {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 100%;
    padding: 0 12px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  .seg:last-child { border-right: none; }

  .seg-main {
    background: rgba(10, 12, 16, 0.92);
    color: #e7eaf0;
    font-weight: 600;
  }

  .icon {
    width: 12px;
    height: 12px;
    opacity: 0.9;
    display: block;
    flex: 0 0 auto;
  }

  .text {
    transform: translateY(-0.3px);
  }
</style>
</head>
<body>
  <div class="watermark">
    <div class="seg seg-main">
      <img class="icon" src="https://api.iconify.design/material-symbols/diamond-rounded.svg?color=%23ff1f1f" alt="logo">
      <span class="text">Rex.lua</span>
    </div>

    <div class="seg">
      <img class="icon" src="https://api.iconify.design/material-symbols/person-rounded.svg?color=%23ff1f1f" alt="username">
      <span class="text" id="pid">parlaklığı arttır rex yazısını gör kardeşim</span>
    </div>

    <div class="seg">
      <img class="icon" src="https://api.iconify.design/material-symbols/workspace-premium-rounded.svg?color=%23ff1f1f" alt="lifetime">
      <span class="text" id="expire">Lifetime</span>
    </div>

    <div class="seg">
      <img class="icon" src="https://api.iconify.design/material-symbols/calendar-month-rounded.svg?color=%23ff1f1f" alt="today">
      <span class="text" id="date">--</span>
    </div>

  </div>

  <script>
    function readQuery(keys) {
      var params = new URLSearchParams(window.location.search);
      for (var i = 0; i < keys.length; i++) {
        var value = params.get(keys[i]);
        if (value) return value;
      }
      return '';
    }

    function autoPlayerId() {
      return readQuery(['pid', 'id', 'username', 'name', 'user']) || document.getElementById('pid').textContent;
    }

    function autoExpire() {
      var fromQuery = readQuery(['expire', 'exp', 'expires']);
      if (fromQuery) return fromQuery;

      var fromLocal = localStorage.getItem('rex_expire') || localStorage.getItem('expire');
      if (fromLocal) return fromLocal;

      if (typeof window.__REX_EXPIRE__ === 'string' && window.__REX_EXPIRE__) {
        return window.__REX_EXPIRE__;
      }

      return '';
    }

    function formatDate(value) {
      if (!value) return '--';
      return value;
    }

    function getTodayText() {
      var now = new Date();
      return now.toLocaleDateString('en-US', {
        month: 'short',
        day: '2-digit',
        year: 'numeric'
      }).replace(',', '');
    }

    function setTodayDate() {
      document.getElementById('date').textContent = getTodayText();
    }

    document.getElementById('pid').textContent = autoPlayerId();
    var expireText = autoExpire();
    if (expireText) {
      document.getElementById('expire').textContent = 'Expires in ' + formatDate(expireText);
    }
    setTodayDate();
    setInterval(setTodayDate, 60000);

    window.addEventListener('message', function(e) {
      if (!e.data) return;

      if (e.data.type === 'setName') {
        document.getElementById('pid').textContent = e.data.name;
      }
      if (e.data.type === 'setUsername') {
        document.getElementById('pid').textContent = e.data.username;
      }
      if (e.data.type === 'setPlayerId') {
        document.getElementById('pid').textContent = e.data.id;
      }

      if (e.data.type === 'setDate') {
        document.getElementById('date').textContent = formatDate(e.data.date);
      }
      if (e.data.type === 'setExpire') {
        document.getElementById('expire').textContent = 'Expires in ' + formatDate(e.data.date);
      }
      if (e.data.type === 'setExpireText') {
        document.getElementById('expire').textContent = 'Expires in ' + formatDate(e.data.expire);
      }

    });
  </script>
</body>
</html>
