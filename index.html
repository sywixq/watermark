<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent !important;
    font-family: 'Segoe UI', sans-serif;
  }

  .watermark {
    position: fixed;
    top: 10px;
    right: 10px;
    display: inline-flex;
    align-items: stretch;
    height: 30px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #2e2e2e;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }

  .red-bar {
    width: 3px;
    background: #c0000a;
    flex: 0 0 auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    background: #0a0a0a;
    border-right: 1px solid #2a2a2a;
  }

  .brand-logo {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    object-fit: contain;
  }

  .brand-name {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.3px;
  }

  .info {
    display: flex;
    align-items: center;
    background: #161616;
  }

  .seg {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 400;
    color: #b8b8b8;
    white-space: nowrap;
  }

  .sep {
    width: 1px;
    height: 14px;
    background: #3a3a3a;
    flex: 0 0 auto;
  }
</style>
</head>
<body>

  <div class="watermark">
    <div class="red-bar"></div>

    <div class="brand">
      <img class="brand-logo" id="logo" src="https://cdn.discordapp.com/attachments/1474827867455098933/1484322181402984651/Yeni_Proje_1.png?ex=69be7701&is=69bd2581&hm=70ed9c00ac7c87d0141c5fe6728ad8dcfdc31e41db7f91df3215b77f65eae1b4&animated=true" alt="logo" onerror="this.style.display='none'">
      <span class="brand-name">THE BEST</span>
    </div>

    <div class="info">
      <div class="seg" id="pid">...</div>
      <div class="sep"></div>
      <div class="seg" id="date">--</div>
      <div class="sep"></div>
      <div class="seg" id="expire">Never expires</div>
    </div>
  </div>

  <script>
    function getTodayText() {
      var now = new Date();
      return now.toLocaleDateString('en-US', {
        month: 'short', day: '2-digit', year: 'numeric'
      }).replace(',', '');
    }

    document.getElementById('date').textContent = getTodayText();

    setInterval(function() {
      document.getElementById('date').textContent = getTodayText();
    }, 60000);

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      var d = e.data;

      // Lua: setPlayerId -> id
      if (d.type === 'setPlayerId') {
        document.getElementById('pid').textContent = d.id || '';
      }

      // Lua: setExpire -> date
      if (d.type === 'setExpire') {
        var val = d.date || d.expire || d.text || '';
        document.getElementById('expire').textContent = val || 'Never expires';
      }

      // Fallback tipler
      if (d.type === 'setName')     document.getElementById('pid').textContent     = d.name || '';
      if (d.type === 'setUsername') document.getElementById('pid').textContent     = d.username || d.name || '';
      if (d.type === 'setDate')     document.getElementById('date').textContent    = d.date || getTodayText();
      if (d.type === 'setLogo')     document.getElementById('logo').src            = d.url || '';
    });
  </script>

</body>
</html>
